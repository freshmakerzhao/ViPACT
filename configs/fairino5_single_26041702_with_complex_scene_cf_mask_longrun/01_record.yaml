# ==================== 任务配置 ====================
task:
  name: sim_lifting_cube_with_complex_scene_scripted
  # 长时提精度版本：重新录制更大规模数据
  dataset_dir: ./data_sim_episodes/26041701_with_complex_scene_cf_mask_longrun
  num_episodes: 400
  episode_len: 400
  camera_names:
    - top
    - cockpit

# ==================== 设备配置 ====================
equipment:
  model: fairino5_single

# ==================== 多目标条件化录制配置 ====================
target_conditioning:
  enabled: true
  sampling: cycle
  counterfactual_same_layout: true

# ==================== 渲染配置 ====================
render:
  onscreen_render: false
