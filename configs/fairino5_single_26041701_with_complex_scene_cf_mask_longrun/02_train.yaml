# ==================== 任务配置 ====================
task:
  name: sim_lifting_cube_with_complex_scene_scripted
  dataset_dir: ./data_sim_episodes/26041701_with_complex_scene_cf_mask_longrun
  num_episodes: 400
  episode_len: 400
  camera_names:
    - top
    - cockpit

# ==================== 设备配置 ====================
equipment:
  model: fairino5_single

# ==================== 训练配置 ====================
training:
  policy_class: ACT
  # 与当前稳定配置一致，避免显存/稳定性风险
  batch_size: 16
  # 长时训练：适合整天跑，依赖 val 选 policy_best
  num_epochs: 8000
  # 略降学习率，提升后期收敛稳定性
  lr: 5e-6
  seed: 1000
  # 评估阶段做时序聚合，通常对成功率更友好
  temporal_agg: true

# ==================== ACT策略参数 ====================
act:
  kl_weight: 10
  chunk_size: 100
  hidden_dim: 512
  dim_feedforward: 3200

# ==================== ViPACT配置 ====================
vipact:
  use_mask_conditioning: true

# ==================== 输出配置 ====================
output:
  ckpt_dir: ./ckpts/26041701_with_complex_scene_cf_mask_longrun

# ==================== 渲染配置 ====================
render:
  onscreen_render: false
