# ==================== 任务配置 ====================
task:
  name: sim_lifting_cube_with_complex_scene_scripted
  dataset_dir: ./data_sim_episodes/26041507_with_complex_scene_multitarget_mask
  num_episodes: 200
  episode_len: 400
  camera_names:
    - top
    - cockpit

# ==================== 设备配置 ====================
equipment:
  model: fairino5_single

# ==================== 多目标条件化录制配置 ====================
target_conditioning:
  enabled: true
  sampling: cycle
  counterfactual_same_layout: true

# ==================== 渲染配置 ====================
render:
  onscreen_render: false
