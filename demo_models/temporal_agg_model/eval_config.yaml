# ==================== 任务配置 ====================
task:
  name: sim_lifting_cube_with_complex_scene_scripted
  dataset_dir: ./data_sim_episodes/26041701_with_complex_scene_cf_mask_longrun
  num_episodes: 400
  episode_len: 400
  camera_names:
    - top
    - cockpit

# ==================== 设备配置 ====================
equipment:
  model: fairino5_single

# ==================== 训练配置（评估时回读） ====================
training:
  policy_class: ACT
  batch_size: 16
  num_epochs: 8000
  lr: 5e-6
  seed: 1000
  temporal_agg: true

# ==================== ACT策略参数 ====================
act:
  kl_weight: 10
  chunk_size: 100
  hidden_dim: 512
  dim_feedforward: 3200

# ==================== ViPACT配置 ====================
vipact:
  use_mask_conditioning: true

# ==================== 输出配置 ====================
output:
  ckpt_dir: ./ckpts/26041701_with_complex_scene_cf_mask_longrun

# ==================== 渲染配置 ====================
render:
  onscreen_render: false

# ==================== 评估配置 ====================
eval:
  enabled: true
  clear_videos_before_eval: true
  batch_size: 8
  mask_ablation: oracle
  target_id: 0
  output_dir: ./ckpts/26041701_with_complex_scene_cf_mask_longrun/eval_target_0
